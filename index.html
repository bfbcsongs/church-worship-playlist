<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Worship Playlist</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#222;color:white;padding:20px;text-align:center}
.container{padding:20px;max-width:700px;margin:auto}
button{width:100%;padding:16px;margin:7px 0;border:0;border-radius:12px;font-size:18px;cursor:pointer}
.category{background:white}
.song{background:#eee}
h2{margin-top:30px}
</style>
</head>

<body>

<header>
<h1>🎶 Church Worship Playlist</h1>
<p>Approved Songs Only</p>
</header>

<div class="container">

<h2>Categories</h2>

<button class="category" onclick="showSongs('Joyful')">🎵 Joyful</button>
<button class="category" onclick="showSongs('Solemn')">🙏 Solemn</button>
<button class="category" onclick="showSongs('Offering')">💰 Offering</button>
<button class="category" onclick="showSongs('Closing')">✝️ Closing</button>

<div id="songs"></div>

</div>

<script>

const songs = {
Joyful: [
"Sample Joyful Song"
],
Solemn: [
"Sample Solemn Song"
],
Offering: [
"Sample Offering Song"
],
Closing: [
"Sample Closing Song"
]
};

function showSongs(category){

let html = "<h2>"+category+"</h2>";

songs[category].forEach(song=>{
html += "<button class='song'>🎵 "+song+"</button>";
});

document.getElementById("songs").innerHTML = html;

}

</script>

</body>
</html>
