<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFBC Worship Playlist</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{margin:0 0 5px}
h2{margin-top:5px}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:15px 0 25px;
}

.category{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px 10px;
  font-size:17px;
  cursor:pointer;
}

.category.active{
  background:#111827;
  color:white;
}

.admin{
  width:100%;
  background:#111827;
  color:white;
  margin-top:5px;
}

.library{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#e5e7eb;
  padding:12px 8px;
  text-align:left;
}

td{
  padding:10px 8px;
  border-top:1px solid #eee;
  vertical-align:middle;
}

.song-title{
  font-weight:bold;
}

.action{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  background:#e5e7eb;
}

.play{
  background:#16a34a;
  color:white;
}

audio{
  width:180px;
  max-width:100%;
}

.empty{
  padding:20px;
  text-align:center;
  color:#666;
}

.hidden{
  display:none;
}

.back{
  background:#ddd;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:150px;
}

.save{
  background:#2563eb;
  color:white;
  width:100%;
}

pre{
  white-space:pre-wrap;
  font-family:Arial,sans-serif;
  line-height:1.6;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

@media(max-width:650px){
  .categories{
    grid-template-columns:1fr 1fr;
  }

  table{
    font-size:14px;
  }

  th,td{
    padding:8px 5px;
  }

  audio{
    width:140px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎶 BFBC Worship Playlist</h1>
  <p>Approved Worship Songs</p>
</header>

<div class="container">

  <!-- MAIN PAGE -->
  <div id="home">

    <h2>Choose Category</h2>

    <div class="categories">

      <button class="category active" onclick="selectCategory('Joyful',this)">
        🎵 Joyful
      </button>

      <button class="category" onclick="selectCategory('Solemn',this)">
        🙏 Solemn
      </button>

      <button class="category" onclick="selectCategory('Offering',this)">
        💰 Offering
      </button>

      <button class="category" onclick="selectCategory('Closing',this)">
        ✝️ Closing
      </button>

    </div>

    <button class="category admin" onclick="showAdmin()">
      ⚙️ ADMIN
    </button>

    <br><br>

    <h2 id="libraryTitle">🎵 Joyful Songs</h2>

    <div class="library">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Chords</th>
            <th>Lyrics</th>
            <th>MP3 ▶️</th>
          </tr>
        </thead>

        <tbody id="songTable">
          <tr>
            <td colspan="5" class="empty">
              Loading songs...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>


  <!-- SONG DETAILS -->
  <div id="songPage" class="hidden">

    <button class="back" onclick="goHome()">
      ← Back
    </button>

    <div class="card">

      <h2 id="songTitle"></h2>

      <p id="songCategory"></p>

      <audio id="audioPlayer" controls class="hidden"></audio>

      <h3>Lyrics</h3>
      <pre id="songLyrics"></pre>

      <h3>Chords</h3>
      <pre id="songChords"></pre>

    </div>

  </div>


  <!-- ADMIN -->
  <div id="adminPage" class="hidden">

    <button class="back" onclick="goHome()">
      ← Back
    </button>

    <div class="card">

      <h2>➕ Add Approved Song</h2>

      <label>Song Title</label>
      <input id="title" type="text" placeholder="Song title">

      <label>Category</label>

      <select id="category">

        <option value="Joyful">
          🎵 Joyful
        </option>

        <option value="Solemn">
          🙏 Solemn
        </option>

        <option value="Offering">
          💰 Offering
        </option>

        <option value="Closing">
          ✝️ Closing
        </option>

      </select>

      <label>Lyrics</label>
      <textarea id="lyrics" placeholder="Paste lyrics here"></textarea>

      <label>Chords</label>
      <textarea id="chords" placeholder="Paste chords here"></textarea>

      <label>MP3 Audio (optional)</label>
<input id="audioFile" type="file" accept="audio/mpeg">

<label>OR Audio Link (optional)</label>
<input
  id="audioLink"
  type="url"
  placeholder="Paste direct MP3 audio link here">

      <button class="save" onclick="saveSong()">
        💾 Save Approved Song
      </button>

      <p id="status" class="status"></p>

    </div>

  </div>

</div>


<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL = "https://mafzmcyxqczumcioobng.supabase.co";
const SUPABASE_KEY = "sb_publishable_hfMDIU_taSvvaXKi8hft4Q_iHyuR4Rp";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================
   APP VARIABLES
================================ */

let currentCategory = "Joyful";


/* ================================
   CATEGORY
================================ */

function selectCategory(category, button){

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  loadSongs(category);
}


/* ================================
   LOAD SONGS
================================ */

async function loadSongs(category){

  const table =
    document.getElementById("songTable");

  const title =
    document.getElementById("libraryTitle");

  title.textContent =
    getCategoryIcon(category) +
    " " +
    category +
    " Songs";

  table.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Loading songs...
      </td>
    </tr>
  `;


  const { data, error } =
    await supabaseClient
      .from("songs")
      .select("*")
      .eq("category", category)
      .eq("approved", true)
      .order("title", { ascending:true });


  if(error){

    table.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Error loading songs:<br>
          ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    return;
  }


  if(!data || data.length === 0){

    table.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No approved songs in this category yet.
        </td>
      </tr>
    `;

    return;
  }


  table.innerHTML = "";


  data.forEach((song,index)=>{

    const row =
      document.createElement("tr");


    /* NUMBER */

    const number =
      document.createElement("td");

    number.textContent =
      index + 1;


    /* TITLE */

    const titleCell =
      document.createElement("td");

    const titleButton =
      document.createElement("button");

    titleButton.className =
      "action song-title";

    titleButton.textContent =
      song.title;

    titleButton.onclick =
      () => openSong(song);

    titleCell.appendChild(titleButton);


    /* CHORDS */

    const chordsCell =
      document.createElement("td");

    const chordsButton =
      document.createElement("button");

    chordsButton.className =
      "action";

    chordsButton.textContent =
      "🎼 View";

    chordsButton.onclick =
      () => openSong(song,"chords");

    chordsCell.appendChild(chordsButton);


    /* LYRICS */

    const lyricsCell =
      document.createElement("td");

    const lyricsButton =
      document.createElement("button");

    lyricsButton.className =
      "action";

    lyricsButton.textContent =
      "📖 View";

    lyricsButton.onclick =
      () => openSong(song,"lyrics");

    lyricsCell.appendChild(lyricsButton);


    /* MP3 */

    const audioCell =
      document.createElement("td");

    if(song.audio){

      const audio =
        document.createElement("audio");

      audio.controls = true;

      audio.src =
        song.audio;

      audioCell.appendChild(audio);

    }else{

      audioCell.textContent =
        "—";

    }


    row.appendChild(number);
    row.appendChild(titleCell);
    row.appendChild(chordsCell);
    row.appendChild(lyricsCell);
    row.appendChild(audioCell);

    table.appendChild(row);

  });

}


/* ================================
   OPEN SONG
================================ */

function openSong(song,focus){

  document.getElementById("home").classList.add("hidden");
  document.getElementById("songPage").classList.remove("hidden");

  document.getElementById("songTitle").textContent = song.title;

  document.getElementById("songCategory").textContent =
    "Category: " + song.category;

  const lyrics = document.getElementById("songLyrics");
  const chords = document.getElementById("songChords");

  const lyricsHeading = lyrics.previousElementSibling;
  const chordsHeading = chords.previousElementSibling;

  // Show only what was requested
  if(focus === "lyrics"){

    lyricsHeading.classList.remove("hidden");
    lyrics.classList.remove("hidden");

    chordsHeading.classList.add("hidden");
    chords.classList.add("hidden");

    lyrics.textContent =
      song.lyrics || "No lyrics added.";

  }
  else if(focus === "chords"){

    chordsHeading.classList.remove("hidden");
    chords.classList.remove("hidden");

    lyricsHeading.classList.add("hidden");
    lyrics.classList.add("hidden");

    chords.textContent =
      song.chords || "No chords added.";

  }
  else{

    lyricsHeading.classList.remove("hidden");
    lyrics.classList.remove("hidden");

    chordsHeading.classList.remove("hidden");
    chords.classList.remove("hidden");

    lyrics.textContent =
      song.lyrics || "No lyrics added.";

    chords.textContent =
      song.chords || "No chords added.";

  }

  const player =
    document.getElementById("audioPlayer");

  player.removeAttribute("src");

  if(song.audio){

    player.src = song.audio;
    player.classList.remove("hidden");

  }else{

    player.classList.add("hidden");

  }

}
/* ================================
   HOME
================================ */

function goHome(){

  document
    .getElementById("songPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("home")
    .classList.remove("hidden");

  loadSongs(currentCategory);

}


/* ================================
   ADMIN
================================ */

function showAdmin(){

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("songPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");

}


/* ================================
   SAVE SONG
================================ */

async function saveSong(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const lyrics =
    document
      .getElementById("lyrics")
      .value;

  const chords =
    document
      .getElementById("chords")
      .value;

  const file =
    document
      .getElementById("audioFile")
      .files[0];
const audioLink =
  document
    .getElementById("audioLink")
    .value
    .trim();
  const status =
    document
      .getElementById("status");


  if(!title){

    alert(
      "Please enter the song title."
    );

    return;
  }


  status.textContent =
    "Saving...";


  let audioUrl = null;
if(audioLink){
  audioUrl = audioLink;
}

  /* UPLOAD MP3 */

  if(file){

    if(file.type !== "audio/mpeg"){

      alert(
        "Please select an MP3 file."
      );

      status.textContent = "";

      return;
    }


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const filePath =
      Date.now() +
      "_" +
      safeName;


    const {error:uploadError} =
      await supabaseClient
        .storage
        .from("audio")
        .upload(
          filePath,
          file
        );


    if(uploadError){

      status.textContent =
        "Audio upload failed: " +
        uploadError.message;

      return;
    }


    const {data:signedData,error:signedError} =
      await supabaseClient
        .storage
        .from("audio")
        .createSignedUrl(
          filePath,
          31536000
        );


    if(signedError){

      status.textContent =
        "Could not create audio URL: " +
        signedError.message;

      return;
    }


    audioUrl =
      signedData.signedUrl;

  }


  /* SAVE DATABASE RECORD */

  const {error} =
    await supabaseClient
      .from("songs")
      .insert({

        title:title,

        category:category,

        lyrics:lyrics,

        chords:chords,

        audio:audioUrl,

        approved:true

      });


  if(error){

    status.textContent =
      "Song save failed: " +
      error.message;

    return;
  }


  status.textContent =
    "✅ Song saved successfully!";


  document
    .getElementById("title")
    .value = "";

  document
    .getElementById("lyrics")
    .value = "";

  document
    .getElementById("chords")
    .value = "";

  document
    .getElementById("audioFile")
    .value = "";

}


/* ================================
   CATEGORY ICON
================================ */

function getCategoryIcon(category){

  if(category === "Joyful")
    return "🎵";

  if(category === "Solemn")
    return "🙏";

  if(category === "Offering")
    return "💰";

  if(category === "Closing")
    return "✝️";

  return "🎶";

}


/* ================================
   SECURITY
================================ */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   START APP
================================ */

loadSongs("Joyful");

</script>

</body>
</html>
