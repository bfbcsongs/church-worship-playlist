<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFBC Worship Playlist</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}
.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  cursor:pointer;
  font-size:16px;
}
.category{
  width:100%;
  margin:8px 0;
  background:white;
  border:1px solid #ddd;
  text-align:left;
}
.admin{
  background:#111827;
  color:white;
  width:100%;
  margin-top:15px;
}
.card{
  background:white;
  padding:18px;
  margin:12px 0;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
textarea{min-height:150px}
.hidden{display:none}
.back{
  background:#ddd;
  margin-bottom:15px;
}
.play{
  background:#16a34a;
  color:white;
  width:100%;
}
.save{
  background:#2563eb;
  color:white;
  width:100%;
}
audio{
  width:100%;
  margin:12px 0;
}
h2{margin-top:5px}
pre{
  white-space:pre-wrap;
  font-family:Arial,sans-serif;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <h1>🎶 BFBC Worship Playlist</h1>
  <p>Approved Worship Songs</p>
</header>

<div class="container">

  <div id="home">
    <h2>Choose Category</h2>

    <button class="category" onclick="showCategory('Joyful')">
      🎵 Joyful
    </button>

    <button class="category" onclick="showCategory('Solemn')">
      🙏 Solemn
    </button>

    <button class="category" onclick="showCategory('Offering')">
      💰 Offering
    </button>

    <button class="category" onclick="showCategory('Closing')">
      ✝️ Closing
    </button>

    <button class="admin" onclick="showAdmin()">
      ⚙️ Admin
    </button>
  </div>

  <div id="categoryPage" class="hidden">
    <button class="back" onclick="goHome()">← Back</button>
    <h2 id="categoryTitle"></h2>
    <div id="songList">Loading...</div>
  </div>

  <div id="songPage" class="hidden">
    <button class="back" onclick="goBackCategory()">← Back</button>
    <div class="card">
      <h2 id="songTitle"></h2>
      <p id="songCategory"></p>

      <audio id="audioPlayer" controls></audio>

      <h3>Lyrics</h3>
      <pre id="songLyrics"></pre>

      <h3>Chords</h3>
      <pre id="songChords"></pre>
    </div>
  </div>

  <div id="adminPage" class="hidden">
    <button class="back" onclick="goHome()">← Back</button>

    <div class="card">
      <h2>➕ Add Approved Song</h2>

      <label>Song Title</label>
      <input id="title" type="text" placeholder="Song title">

      <label>Category</label>
      <select id="category">
        <option value="Joyful">🎵 Joyful</option>
        <option value="Solemn">🙏 Solemn</option>
        <option value="Offering">💰 Offering</option>
        <option value="Closing">✝️ Closing</option>
      </select>

      <label>Lyrics</label>
      <textarea id="lyrics" placeholder="Paste lyrics here"></textarea>

      <label>Chords</label>
      <textarea id="chords" placeholder="Paste chords here"></textarea>

      <label>MP3 Audio</label>
      <input id="audioFile" type="file" accept="audio/mpeg">

      <button class="save" onclick="saveSong()">
        💾 Save Approved Song
      </button>

      <p id="status"></p>
    </div>
  </div>

</div>

<script>

// =====================================================
// SUPABASE CONNECTION
// =====================================================

// PAL: PALITAN ANG DALAWANG VALUE NA ITO
// gamit ang Project URL at Publishable Key mo.

const SUPABASE_URL = "https://mafzmcyxqczumcioobng.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_hfMDIU_taSvvaXKi8hft4Q_iHyuR4Rp";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// =====================================================

let currentCategory = "";

function hideAll(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("categoryPage").classList.add("hidden");
  document.getElementById("songPage").classList.add("hidden");
  document.getElementById("adminPage").classList.add("hidden");
}

function goHome(){
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}

async function showCategory(category){
  currentCategory = category;

  hideAll();

  document.getElementById("categoryPage").classList.remove("hidden");
  document.getElementById("categoryTitle").textContent = category;

  const list = document.getElementById("songList");
  list.innerHTML = "Loading songs...";

  const { data, error } = await supabaseClient
    .from("songs")
    .select("*")
    .eq("category", category)
    .eq("approved", true)
    .order("title");

  if(error){
    list.innerHTML = "Error loading songs: " + error.message;
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = "<p>No approved songs yet.</p>";
    return;
  }

  list.innerHTML = "";

  data.forEach(song => {

    const card = document.createElement("div");
    card.className = "card";

    const button = document.createElement("button");
    button.style.width = "100%";
    button.textContent = "🎵 " + song.title;

    button.onclick = () => openSong(song);

    card.appendChild(button);
    list.appendChild(card);
  });
}

function openSong(song){

  hideAll();

  document.getElementById("songPage").classList.remove("hidden");

  document.getElementById("songTitle").textContent = song.title;
  document.getElementById("songCategory").textContent =
    "Category: " + song.category;

  document.getElementById("songLyrics").textContent =
    song.lyrics || "";

  document.getElementById("songChords").textContent =
    song.chords || "";

  const player = document.getElementById("audioPlayer");

  player.removeAttribute("src");

  if(song.audio){
    player.src = song.audio;
  }
}

function goBackCategory(){
  showCategory(currentCategory);
}

function showAdmin(){
  hideAll();
  document.getElementById("adminPage").classList.remove("hidden");
}

async function saveSong(){

  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const lyrics = document.getElementById("lyrics").value;
  const chords = document.getElementById("chords").value;
  const file = document.getElementById("audioFile").files[0];
  const status = document.getElementById("status");

  if(!title){
    alert("Please enter the song title.");
    return;
  }

  status.textContent = "Saving...";

  let audioUrl = null;

  // Upload MP3
  if(file){

    if(file.type !== "audio/mpeg"){
      alert("Please select an MP3 file.");
      status.textContent = "";
      return;
    }

    const safeName = file.name
      .replace(/[^a-zA-Z0-9._-]/g, "_");

    const filePath =
      Date.now() + "_" + safeName;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("audio")
        .upload(filePath, file);

    if(uploadError){
      status.textContent =
        "Audio upload failed: " + uploadError.message;
      return;
    }

    const { data: signedData, error: signedError } =
      await supabaseClient
        .storage
        .from("audio")
        .createSignedUrl(filePath, 31536000);

    if(signedError){
      status.textContent =
        "Could not create audio URL: " +
        signedError.message;
      return;
    }

    audioUrl = signedData.signedUrl;
  }

  // Save song information
  const { error } = await supabaseClient
    .from("songs")
    .insert({
      title: title,
      category: category,
      lyrics: lyrics,
      chords: chords,
      audio: audioUrl,
      approved: true
    });

  if(error){
    status.textContent =
      "Song save failed: " + error.message;
    return;
  }

  status.textContent = "✅ Song saved successfully!";

  document.getElementById("title").value = "";
  document.getElementById("lyrics").value = "";
  document.getElementById("chords").value = "";
  document.getElementById("audioFile").value = "";
}

</script>

</body>
</html><label>Category</label>
<select id="category">
<option>Joyful</option>
<option>Solemn</option>
<option>Offering</option>
<option>Closing</option>
</select>

<label>Lyrics</label>
<textarea id="lyrics" rows="8" placeholder="Paste lyrics here"></textarea>

<label>Chords</label>
<textarea id="chords" rows="5" placeholder="Paste chords here"></textarea>

<button class="save" onclick="saveSong()">
💾 SAVE SONG
</button>

</div>

</div>

<script>

let songs =
JSON.parse(localStorage.getItem("bfbcSongs") || "[]");

function showCategory(category){

let list=songs.filter(song=>song.category===category);

let html="<h2>"+category+"</h2>";

if(list.length===0){
html+="<p>No approved songs yet.</p>";
}

list.forEach((song,index)=>{
html+=`
<button class="song" onclick="viewSong(${index})">
🎵 ${song.title}
</button>
`;
});

document.getElementById("songs").innerHTML=html;
}

function openAdmin(){

document.getElementById("adminPanel")
.classList.toggle("hidden");

}

function saveSong(){

let title=document.getElementById("title").value.trim();
let category=document.getElementById("category").value;
let lyrics=document.getElementById("lyrics").value;
let chords=document.getElementById("chords").value;

if(!title){
alert("Please enter song title.");
return;
}

songs.push({
title:title,
category:category,
lyrics:lyrics,
chords:chords
});

localStorage.setItem(
"bfbcSongs",
JSON.stringify(songs)
);

document.getElementById("title").value="";
document.getElementById("lyrics").value="";
document.getElementById("chords").value="";

alert("Song saved!");

}

function viewSong(index){

let song=songs[index];

document.getElementById("songs").innerHTML=`
<h2>🎵 ${song.title}</h2>
<p><b>Category:</b> ${song.category}</p>

<h3>📖 Lyrics</h3>
<pre>${song.lyrics || "No lyrics added."}</pre>

<h3>🎸 Chords</h3>
<pre>${song.chords || "No chords added."}</pre>

<button onclick="showCategory('${song.category}')">
⬅️ Back
</button>
`;

}

</script>

</body>
</html>
